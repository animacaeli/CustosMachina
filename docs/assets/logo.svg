<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CustosMachina logo">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
  </defs>

  <!-- 盾牌（守护） -->
  <path d="M32 4 L54 12 V30 C54 45.2 44.8 55.4 32 60 C19.2 55.4 10 45.2 10 30 V12 Z"
        fill="none" stroke="url(#shieldGrad)" stroke-width="5" stroke-linejoin="round"/>

  <!-- 齿轮（机器）：外圈齿 + 中心圆 -->
  <g fill="url(#shieldGrad)">
    <g transform="translate(32 26)">
      <g id="teeth">
        <rect x="-2.2" y="-13.5" width="4.4" height="5" rx="1.2"/>
        <rect x="-2.2" y="8.5"  width="4.4" height="5" rx="1.2"/>
        <rect x="-13.5" y="-2.2" width="5" height="4.4" rx="1.2"/>
        <rect x="8.5"  y="-2.2" width="5" height="4.4" rx="1.2"/>
        <rect x="-2.2" y="-13.5" width="4.4" height="5" rx="1.2" transform="rotate(45)"/>
        <rect x="-2.2" y="8.5"  width="4.4" height="5" rx="1.2" transform="rotate(45)"/>
        <rect x="-13.5" y="-2.2" width="5" height="4.4" rx="1.2" transform="rotate(45)"/>
        <rect x="8.5"  y="-2.2" width="5" height="4.4" rx="1.2" transform="rotate(45)"/>
      </g>
      <circle r="9.5" fill="none" stroke="url(#shieldGrad)" stroke-width="4.4"/>
    </g>
  </g>

  <!-- 心跳脉冲（监控/诊断）横穿盾牌下部 -->
  <path d="M17 46 H25 L29 42 L35 50 L39 46 H47"
        fill="none" stroke="url(#pulseGrad)" stroke-width="3.4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
