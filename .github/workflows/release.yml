name: Release

# 打 tag（v*）发版：构建 backend / frontend 双架构镜像推 ghcr.io，
# 并创建 GitHub Release。镜像仓库公开需要仓库本身为 public。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: ./backend
            image: ${{ github.repository }}-backend
          - context: ./frontend
            image: ${{ github.repository }}-frontend
          - context: ./
            image: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像元数据（tag / latest）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: 镜像设为公开
    needs: images
    runs-on: ubuntu-latest
    steps:
      # GHCR 包可见性与仓库独立（新包默认 private），显式设为 public
      - name: 设置 ghcr 包公开
        run: |
          set -e
          for pkg in custos-machina-backend custos-machina-frontend custos-machina; do
            echo "::group::${pkg}"
            curl -sS -X PATCH \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/user/packages/container/${pkg} \
              -d '{"visibility":"public"}' -o /dev/null -w "%{http_code}\n"
            echo "::endgroup::"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: 创建 GitHub Release
    needs: [images, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 生成 Release 说明
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## 镜像

            GHCR 包名强制小写，实际地址为：

            - `${{ env.REGISTRY }}/animacaeli/custosmachina:${{ github.ref_name }}`（单镜像，nginx + 前后端）
            - `${{ env.REGISTRY }}/animacaeli/custosmachina-backend:${{ github.ref_name }}`
            - `${{ env.REGISTRY }}/animacaeli/custosmachina-frontend:${{ github.ref_name }}`

            ## 一键拉起

            ```bash
            cd deploy
            cp .env.example .env   # 按需修改
            docker compose pull && docker compose up -d
            ```
