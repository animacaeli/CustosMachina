name: Release

# 打 tag（v*）发版：构建 backend / frontend 双架构镜像推 ghcr.io，
# 并创建 GitHub Release。镜像仓库公开需要仓库本身为 public。
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: ./backend
            image: ${{ github.repository }}-backend
          - context: ./frontend
            image: ${{ github.repository }}-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像元数据（tag / latest）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: 创建 GitHub Release
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 生成 Release 说明
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## 镜像

            - `${{ env.REGISTRY }}/${{ github.repository }}-backend:${{ github.ref_name }}`
            - `${{ env.REGISTRY }}/${{ github.repository }}-frontend:${{ github.ref_name }}`

            ## 一键拉起

            ```bash
            cd deploy
            cp .env.example .env   # 按需修改
            docker compose pull && docker compose up -d
            ```
