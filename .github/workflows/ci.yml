name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（lint / test / vuln）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt 检查
        run: |
          out=$(gofmt -l .)
          [ -z "$out" ] || { echo "gofmt 未通过：$out"; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: 单元测试（含竞态检测）
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: 漏洞检测（govulncheck）
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: 构建检查
        run: CGO_ENABLED=0 go build ./...

  frontend:
    name: 前端（lint / typecheck / test / build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: 类型检查
        run: pnpm check:type

      - name: 单元测试
        # 排除 vben 上游模板 @core/ui-kit/form-ui 的 2 个已知失败用例（与本项目代码无关）
        run: npx vitest run --dom --exclude '**/ui-kit/form-ui/**'

      - name: 构建主应用（web-antd）
        run: pnpm build:antd
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  codeql:
    name: CodeQL 安全扫描
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # 只扫描自研代码，跳过 vendored 的 vben 模板与依赖
          config: |
            paths-ignore:
              - frontend/node_modules
              - frontend/packages
              - frontend/internal
              - frontend/playground
              - frontend/docs

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
